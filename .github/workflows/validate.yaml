name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Hassfest and HACS only need to read repository contents.
permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    # Skip on non-canonical repos (e.g. the private dev mirror); HACS
    # and Hassfest only make sense on the public canonical repo.
    if: github.repository == 'kohkohwastaken/meshcore-ha-chat'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hassfest
        # Pinned to 2026-04-07 HEAD on home-assistant/actions/master.
        # Bump on a quarterly cadence to take security and behaviour
        # fixes; verify with a full validate.yaml run after each bump.
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    if: github.repository == 'kohkohwastaken/meshcore-ha-chat'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run HACS validation
        # Pinned to 2026-01-26 HEAD on hacs/action/main.
        # Bump on a quarterly cadence to take security and behaviour
        # fixes; verify with a full validate.yaml run after each bump.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  frontend:
    # Builds and tests the Lit panel bundle. CodeQL/Hassfest/HACS do not
    # exercise the rollup build, so without this job a dependency bump
    # that breaks `npm run build` can merge green (see plugin-typescript
    # v12 outDir break, 2026-06). This job is the gate that catches it.
    name: Frontend build & test
    runs-on: ubuntu-latest
    if: github.repository == 'kohkohwastaken/meshcore-ha-chat'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check the committed bundle is up to date
        # The built panel is committed (HACS installs it as-is). Fail if
        # the source changed without rebuilding it.
        run: git diff --exit-code -- ../custom_components/meshcore_chat/meshcore-chat-panel.js

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    if: github.repository == 'kohkohwastaken/meshcore-ha-chat'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # TODO: pin to a commit SHA like the other actions.
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: python -m pytest tests -q
